<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lideon Studios — Practice Log</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@300;400;500;600&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#09090b;
  --surface:#0f0f12;
  --surface2:#151518;
  --surface3:#1c1c21;
  --border:#1e1e26;
  --border2:#2a2a35;
  --text:#e0deda;
  --muted:#4a4858;
  --muted2:#6a6878;
  --red:#b83228;
  --red-bright:#e04030;
  --red-dim:rgba(184,50,40,0.12);
  --red-glow:rgba(184,50,40,0.25);
  --blue:#1a6fa8;
  --blue-dim:rgba(26,111,168,0.12);
  --green:#1a8048;
  --green-dim:rgba(26,128,72,0.12);
  --amber:#c07820;
  --amber-dim:rgba(192,120,32,0.12);
  --purple:#7040c0;
  --purple-dim:rgba(112,64,192,0.12);
  --mono:'Space Mono',monospace;
  --sans:'Inter',sans-serif;
}

body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;padding-bottom:60px}

/* ── HEADER ── */
.header{
  padding:28px 20px 20px;
  border-bottom:1px solid var(--border);
  position:relative;overflow:hidden;
}
.header::before{
  content:'';
  position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,var(--red),transparent);
}
.header::after{
  content:'LOG';
  position:absolute;right:-6px;top:-8px;
  font-family:var(--mono);font-size:72px;font-weight:700;
  color:var(--border);pointer-events:none;user-select:none;line-height:1;
}
.header-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.header-left .eyebrow{font-family:var(--mono);font-size:9px;letter-spacing:0.25em;text-transform:uppercase;color:var(--muted2);margin-bottom:5px}
.header-left h1{font-family:var(--mono);font-size:18px;font-weight:700;line-height:1.2;margin-bottom:2px}
.header-left .sub{font-size:11px;color:var(--muted2)}
.streak-badge{
  text-align:center;flex-shrink:0;
  background:var(--surface2);border:1px solid var(--border2);
  padding:10px 14px;
}
.streak-num{font-family:var(--mono);font-size:24px;font-weight:700;color:var(--red);line-height:1}
.streak-label{font-family:var(--mono);font-size:8px;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted2);margin-top:2px}

/* ── NAV ── */
.nav{display:flex;border-bottom:1px solid var(--border)}
.nav-btn{
  font-family:var(--mono);font-size:9px;letter-spacing:0.08em;text-transform:uppercase;
  padding:11px 16px;background:transparent;border:none;border-right:1px solid var(--border);
  color:var(--muted2);cursor:pointer;white-space:nowrap;transition:all 0.12s;flex-shrink:0;
}
.nav-btn:last-child{border-right:none}
.nav-btn:hover{color:var(--text)}
.nav-btn.active{color:var(--text);background:var(--surface2);border-bottom:2px solid var(--red)}
.page{display:none;padding:16px 20px}
.page.active{display:block}

/* ── FORM ── */
.form-section{margin-bottom:20px}
.form-title{
  font-family:var(--mono);font-size:9px;letter-spacing:0.2em;
  text-transform:uppercase;color:var(--muted2);
  margin-bottom:10px;padding-bottom:6px;
  border-bottom:1px solid var(--border);
}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.form-grid.single{grid-template-columns:1fr}
.form-grid.three{grid-template-columns:1fr 1fr 1fr}

.field{display:flex;flex-direction:column;gap:4px}
.field label{font-family:var(--mono);font-size:8px;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted2)}
.field input,.field select,.field textarea{
  font-family:var(--mono);font-size:11px;
  background:var(--surface2);border:1px solid var(--border);
  color:var(--text);padding:8px 10px;outline:none;
  transition:border-color 0.12s;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--border2)}
.field select option{background:var(--surface2)}
.field textarea{resize:vertical;min-height:60px;line-height:1.5;font-size:11px}
.field input[type="range"]{padding:4px 0;accent-color:var(--red)}

/* CHECKBOX GRID */
.check-grid{display:flex;flex-wrap:wrap;gap:6px}
.check-item{
  display:flex;align-items:center;gap:6px;
  padding:6px 10px;
  background:var(--surface2);border:1px solid var(--border);
  cursor:pointer;transition:all 0.1s;user-select:none;
  font-size:11px;color:var(--muted2);
}
.check-item:hover{border-color:var(--border2);color:var(--text)}
.check-item.checked{background:var(--red-dim);border-color:var(--red);color:var(--text)}
.check-item input{display:none}
.check-dot{
  width:8px;height:8px;border-radius:50%;
  background:var(--border2);flex-shrink:0;transition:background 0.1s;
}
.check-item.checked .check-dot{background:var(--red)}

/* RATING STARS */
.stars{display:flex;gap:4px}
.star{
  font-size:18px;cursor:pointer;color:var(--border2);
  transition:color 0.1s;user-select:none;
}
.star.on{color:var(--amber)}

/* SUBMIT */
.submit-btn{
  font-family:var(--mono);font-size:11px;font-weight:700;
  letter-spacing:0.1em;text-transform:uppercase;
  width:100%;padding:13px;background:var(--red);border:none;
  color:#fff;cursor:pointer;transition:all 0.12s;margin-top:8px;
}
.submit-btn:hover{background:var(--red-bright)}
.submit-btn:active{transform:scale(0.99)}

/* ── ANALYTICS ── */
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.stat-card{background:var(--surface2);border:1px solid var(--border);padding:12px 13px;text-align:center}
.stat-num{font-family:var(--mono);font-size:22px;font-weight:700;color:var(--text);line-height:1;margin-bottom:3px}
.stat-num.red{color:var(--red)}
.stat-num.green{color:var(--green)}
.stat-num.blue{color:var(--blue)}
.stat-label{font-family:var(--mono);font-size:8px;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted2)}

/* HEATMAP */
.heatmap-wrap{background:var(--surface2);border:1px solid var(--border);padding:14px;margin-bottom:12px}
.heatmap-title{font-family:var(--mono);font-size:9px;letter-spacing:0.15em;text-transform:uppercase;color:var(--muted2);margin-bottom:10px}
.heatmap{display:flex;flex-wrap:wrap;gap:3px}
.hm-day{
  width:14px;height:14px;
  background:var(--surface3);border:1px solid var(--border);
  cursor:default;position:relative;
  transition:background 0.1s;
}
.hm-day.practiced-low{background:var(--red-dim);border-color:rgba(184,50,40,0.3)}
.hm-day.practiced-mid{background:rgba(184,50,40,0.35);border-color:var(--red)}
.hm-day.practiced-high{background:var(--red);border-color:var(--red-bright)}
.hm-day.today{border-color:var(--amber)!important}

/* BAR CHART */
.chart-wrap{background:var(--surface2);border:1px solid var(--border);padding:14px;margin-bottom:12px}
.chart-title{font-family:var(--mono);font-size:9px;letter-spacing:0.15em;text-transform:uppercase;color:var(--muted2);margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.chart-title span{color:var(--muted2);font-size:8px}
.bar-list{display:flex;flex-direction:column;gap:7px}
.bar-row{display:flex;align-items:center;gap:8px}
.bar-label{font-family:var(--mono);font-size:9px;color:var(--muted2);width:90px;flex-shrink:0;text-align:right;text-transform:uppercase;letter-spacing:0.04em}
.bar-track{flex:1;background:var(--surface3);height:18px;position:relative;border:1px solid var(--border)}
.bar-fill{height:100%;background:var(--red);transition:width 0.4s;position:relative}
.bar-fill.fav{background:var(--green)}
.bar-fill.low{background:var(--purple)}
.bar-count{font-family:var(--mono);font-size:9px;color:var(--muted2);width:28px;text-align:right;flex-shrink:0}

/* INSIGHTS */
.insights{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.insight-card{background:var(--surface2);border:1px solid var(--border);padding:12px 13px}
.insight-card.highlight{border-color:var(--red);background:var(--red-dim)}
.insight-card.low{border-color:var(--purple);background:var(--purple-dim)}
.insight-label{font-family:var(--mono);font-size:8px;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted2);margin-bottom:4px}
.insight-val{font-size:13px;font-weight:500;color:var(--text);line-height:1.4}
.insight-sub{font-size:10px;color:var(--muted2);margin-top:3px}

/* BPM TIMELINE */
.bpm-timeline{background:var(--surface2);border:1px solid var(--border);padding:14px;margin-bottom:12px}
.bpm-dots{display:flex;align-items:flex-end;gap:4px;height:48px;overflow-x:auto}
.bpm-dot-wrap{display:flex;flex-direction:column;align-items:center;gap:2px;flex-shrink:0}
.bpm-dot{
  width:10px;background:var(--blue);
  transition:height 0.3s;
}
.bpm-tick{font-family:var(--mono);font-size:7px;color:var(--muted2);writing-mode:vertical-rl;transform:rotate(180deg)}

/* ── HISTORY ── */
.history-filters{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.filter-btn{
  font-family:var(--mono);font-size:9px;padding:5px 10px;
  background:var(--surface2);border:1px solid var(--border);
  color:var(--muted2);cursor:pointer;transition:all 0.1s;
}
.filter-btn:hover{color:var(--text)}
.filter-btn.active{background:var(--red-dim);border-color:var(--red);color:var(--text)}

.entry-card{
  background:var(--surface2);border:1px solid var(--border);
  margin-bottom:8px;overflow:hidden;
}
.entry-header{display:flex;align-items:center;gap:10px;padding:10px 13px;cursor:pointer}
.entry-date{font-family:var(--mono);font-size:10px;color:var(--muted2);flex-shrink:0;min-width:80px}
.entry-summary{flex:1;font-size:11px;color:var(--text)}
.entry-dur{font-family:var(--mono);font-size:10px;color:var(--muted2);flex-shrink:0}
.entry-mood{font-size:14px;flex-shrink:0}
.entry-body{display:none;padding:10px 13px;border-top:1px solid var(--border);font-size:11px;color:var(--muted2);line-height:1.7}
.entry-body.open{display:block}
.entry-body strong{color:var(--text);font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:0.08em}
.entry-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.etag{font-family:var(--mono);font-size:8px;padding:2px 6px;background:var(--surface3);border:1px solid var(--border);color:var(--muted2)}
.etag.red{border-color:var(--red);color:var(--red-bright)}
.delete-btn{font-family:var(--mono);font-size:8px;padding:4px 8px;background:transparent;border:1px solid var(--border);color:var(--muted2);cursor:pointer;margin-top:8px;float:right}
.delete-btn:hover{border-color:var(--red);color:var(--red)}

.empty-state{text-align:center;padding:48px 20px;color:var(--muted2)}
.empty-state p{font-family:var(--mono);font-size:11px;line-height:2}
.empty-state strong{color:var(--text)}

/* TOAST */
.toast{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);
  background:var(--surface2);border:1px solid var(--red);
  color:var(--text);font-family:var(--mono);font-size:10px;
  padding:10px 18px;letter-spacing:0.08em;
  transition:transform 0.3s;z-index:999;pointer-events:none;
}
.toast.show{transform:translateX(-50%) translateY(0)}

@media(max-width:480px){
  .stats-row{grid-template-columns:1fr 1fr}
  .insights{grid-template-columns:1fr}
  .form-grid.three{grid-template-columns:1fr 1fr}
  .bar-label{width:70px;font-size:8px}
}
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div class="header-left">
      <div class="eyebrow">Lideon Studios · hundo</div>
      <h1>Practice Log</h1>
      <div class="sub">7-String Drop A · Deathcore / Metalcore</div>
    </div>
    <div class="streak-badge">
      <div class="streak-num" id="streakNum">0</div>
      <div class="streak-label">day streak</div>
    </div>
  </div>
</div>

<div class="nav">
  <button class="nav-btn active" onclick="setPage('log')">Log Session</button>
  <button class="nav-btn" onclick="setPage('analytics')">Analytics</button>
  <button class="nav-btn" onclick="setPage('history')">History</button>
</div>

<!-- ══ LOG SESSION ══ -->
<div class="page active" id="page-log">

  <!-- Date + Duration -->
  <div class="form-section">
    <div class="form-title">Session Info</div>
    <div class="form-grid three">
      <div class="field">
        <label>Date</label>
        <input type="date" id="f-date">
      </div>
      <div class="field">
        <label>Duration (min)</label>
        <input type="number" id="f-duration" placeholder="45" min="1" max="480">
      </div>
      <div class="field">
        <label>Did you take a break?</label>
        <select id="f-break">
          <option value="">—</option>
          <option value="yes">Yes ✓</option>
          <option value="no">No (rest up!)</option>
        </select>
      </div>
    </div>
    <div class="form-grid">
      <div class="field">
        <label>Key practiced</label>
        <select id="f-key">
          <option value="">— select key —</option>
          <option>Am (A minor)</option>
          <option>Bbm</option><option>Bm</option><option>Cm</option>
          <option>C#m</option><option>Dm</option><option>Ebm</option>
          <option>Em</option><option>Fm</option><option>F#m</option>
          <option>Gm</option><option>G#m</option>
          <option>A major</option><option>Multiple keys</option>
        </select>
      </div>
      <div class="field">
        <label>Mode / Scale</label>
        <select id="f-mode">
          <option value="">— select mode —</option>
          <option>Natural Minor</option>
          <option>Phrygian Dominant</option>
          <option>Minor Pentatonic</option>
          <option>Major</option>
          <option>Chromatic</option>
          <option>Mixed</option>
        </select>
      </div>
    </div>
  </div>

  <!-- Techniques -->
  <div class="form-section">
    <div class="form-title">Techniques Practiced</div>
    <div class="check-grid" id="tech-checks"></div>
  </div>

  <!-- CAGED -->
  <div class="form-section">
    <div class="form-title">CAGED System</div>
    <div class="form-grid">
      <div class="field">
        <label>Position(s) practiced</label>
        <div class="check-grid" id="caged-checks"></div>
      </div>
      <div class="field">
        <label>Studied scales today?</label>
        <select id="f-scales">
          <option value="">—</option>
          <option value="yes-deep">Yes — deep study</option>
          <option value="yes-light">Yes — light review</option>
          <option value="no">No</option>
        </select>
      </div>
    </div>
  </div>

  <!-- Rhythm & Feel -->
  <div class="form-section">
    <div class="form-title">Rhythm & Feel</div>
    <div class="check-grid" id="rhythm-checks"></div>
  </div>

  <!-- Metronome -->
  <div class="form-section">
    <div class="form-title">Metronome</div>
    <div class="form-grid three">
      <div class="field">
        <label>Used metronome?</label>
        <select id="f-metro">
          <option value="">—</option>
          <option value="yes">Yes</option>
          <option value="no">No</option>
        </select>
      </div>
      <div class="field">
        <label>Start BPM</label>
        <input type="number" id="f-bpm-start" placeholder="80" min="40" max="280">
      </div>
      <div class="field">
        <label>End BPM</label>
        <input type="number" id="f-bpm-end" placeholder="140" min="40" max="280">
      </div>
    </div>
  </div>

  <!-- Amp Sim -->
  <div class="form-section">
    <div class="form-title">Gear & Tone</div>
    <div class="form-grid">
      <div class="field">
        <label>Amp sim preset (GE1000)</label>
        <input type="text" id="f-preset" placeholder="e.g. Mesa Boogie high gain, Custom patch 3...">
      </div>
      <div class="field">
        <label>Tuning</label>
        <select id="f-tuning">
          <option value="Drop A">Drop A (standard)</option>
          <option value="Drop Ab">Drop Ab</option>
          <option value="Drop G#">Drop G#</option>
          <option value="Standard 7">Standard 7-string</option>
          <option value="Other">Other</option>
        </select>
      </div>
    </div>
  </div>

  <!-- Riff & Songwriting -->
  <div class="form-section">
    <div class="form-title">Riff & Songwriting</div>
    <div class="form-grid">
      <div class="field">
        <label>Made a riff today?</label>
        <select id="f-riff">
          <option value="">—</option>
          <option value="yes-keeper">Yes — it's a keeper</option>
          <option value="yes-maybe">Yes — maybe</option>
          <option value="fragment">Fragment / idea only</option>
          <option value="no">No</option>
        </select>
      </div>
      <div class="field">
        <label>Intervals used (e.g. i VII VI v)</label>
        <input type="text" id="f-intervals" placeholder="i VII VI v — or leave blank">
      </div>
    </div>
    <div class="form-grid single">
      <div class="field">
        <label>Riff / song notes</label>
        <textarea id="f-riff-notes" placeholder="What did you write? Key, feel, anything worth remembering..."></textarea>
      </div>
    </div>
  </div>

  <!-- Mood & Feel -->
  <div class="form-section">
    <div class="form-title">Session Feel</div>
    <div class="form-grid">
      <div class="field">
        <label>Overall mood</label>
        <div class="stars" id="moodStars">
          <span class="star" data-v="1">★</span>
          <span class="star" data-v="2">★</span>
          <span class="star" data-v="3">★</span>
          <span class="star" data-v="4">★</span>
          <span class="star" data-v="5">★</span>
        </div>
      </div>
      <div class="field">
        <label>Session emoji</label>
        <select id="f-emoji">
          <option value="🔥">🔥 fired up</option>
          <option value="💀">💀 brutal</option>
          <option value="⚡">⚡ electric</option>
          <option value="😤">😤 grinding</option>
          <option value="🎸">🎸 in the zone</option>
          <option value="😅">😅 rough day</option>
          <option value="🧠">🧠 theory mode</option>
          <option value="😴">😴 going through the motions</option>
        </select>
      </div>
    </div>
    <div class="form-grid single">
      <div class="field">
        <label>Session notes / anything else</label>
        <textarea id="f-notes" placeholder="What clicked today? What didn't? What do you want to work on next?"></textarea>
      </div>
    </div>
  </div>

  <button class="submit-btn" onclick="saveSession()">Save Session →</button>
</div>

<!-- ══ ANALYTICS ══ -->
<div class="page" id="page-analytics">
  <div id="analytics-content">
    <div class="empty-state">
      <p><strong>No sessions logged yet.</strong><br>Log your first session to see analytics.</p>
    </div>
  </div>
</div>

<!-- ══ HISTORY ══ -->
<div class="page" id="page-history">
  <div class="history-filters" id="historyFilters">
    <button class="filter-btn active" onclick="filterHistory('all',this)">All</button>
    <button class="filter-btn" onclick="filterHistory('riff',this)">Riffs made</button>
    <button class="filter-btn" onclick="filterHistory('sweep',this)">Sweeping</button>
    <button class="filter-btn" onclick="filterHistory('caged',this)">CAGED</button>
    <button class="filter-btn" onclick="filterHistory('metro',this)">With metronome</button>
  </div>
  <div id="history-list"></div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── CONSTANTS ─────────────────────────────────────────────────────────────
const TECHNIQUES = [
  'Alternate Picking','Palm Muting','Gallop','Triplets','Syncopation',
  'Sweeping','Open Cascades','String Skipping','Hammer-ons / Pull-offs',
  'Slides','Pinch Harmonics','Vibrato','Bends','Chromatic Runs',
  'Chord Stabs','Power Chords','Arpeggios','Mute Clicks',
];
const CAGED_POS = ['Position 1 (E)','Position 2 (D)','Position 3 (C)','Position 4 (A)','Position 5 (G)'];
const RHYTHMS = [
  'Straight 16ths','8th Notes','Down-Up 8ths','Duo + Rest',
  'Quad + Rest','Triplet Burst','Half-Time','Blast Feel',
  'Polyrhythm','Displacement','Phrygian Stutter','Syncopated Stab',
];

// ── STATE ─────────────────────────────────────────────────────────────────
let sessions = JSON.parse(localStorage.getItem('practice_sessions') || '[]');
let mood = 0;
let historyFilter = 'all';

// ── INIT ──────────────────────────────────────────────────────────────────
function init(){
  // Set today's date
  document.getElementById('f-date').value = todayStr();
  // Build checkbox grids
  buildChecks('tech-checks', TECHNIQUES, 'tech');
  buildChecks('caged-checks', CAGED_POS, 'caged');
  buildChecks('rhythm-checks', RHYTHMS, 'rhythm');
  // Stars
  document.querySelectorAll('.star').forEach(s=>{
    s.onclick = ()=>{ mood=parseInt(s.dataset.v); updateStars(); };
  });
  updateStreak();
}

function todayStr(){
  return new Date().toISOString().split('T')[0];
}

function buildChecks(containerId, items, prefix){
  const c = document.getElementById(containerId);
  c.innerHTML = '';
  items.forEach((item,i)=>{
    const div = document.createElement('div');
    div.className = 'check-item';
    div.dataset.prefix = prefix;
    div.dataset.idx = i;
    div.dataset.checked = '0';
    div.innerHTML = `<div class="check-dot"></div>${item}`;
    div.addEventListener('click', function(e){
      e.preventDefault();
      const isChecked = this.dataset.checked === '1';
      this.dataset.checked = isChecked ? '0' : '1';
      this.classList.toggle('checked', !isChecked);
    });
    c.appendChild(div);
  });
}

function getChecked(prefix, items){
  return items.filter((_,i)=>{
    const el = document.querySelector(`.check-item[data-prefix="${prefix}"][data-idx="${i}"]`);
    return el && el.dataset.checked === '1';
  });
}

function updateStars(){
  document.querySelectorAll('.star').forEach(s=>{
    s.classList.toggle('on', parseInt(s.dataset.v)<=mood);
  });
}

// ── SAVE ──────────────────────────────────────────────────────────────────
function saveSession(){
  const date = document.getElementById('f-date').value;
  if(!date){ showToast('Please set a date'); return; }
  const dur = parseInt(document.getElementById('f-duration').value)||0;

  const session = {
    id: Date.now(),
    date,
    duration: dur,
    break: document.getElementById('f-break').value,
    key: document.getElementById('f-key').value,
    mode: document.getElementById('f-mode').value,
    techniques: getChecked('tech', TECHNIQUES),
    cagedPos: getChecked('caged', CAGED_POS),
    rhythms: getChecked('rhythm', RHYTHMS),
    scales: document.getElementById('f-scales').value,
    metronome: document.getElementById('f-metro').value,
    bpmStart: parseInt(document.getElementById('f-bpm-start').value)||null,
    bpmEnd: parseInt(document.getElementById('f-bpm-end').value)||null,
    preset: document.getElementById('f-preset').value,
    tuning: document.getElementById('f-tuning').value,
    riff: document.getElementById('f-riff').value,
    intervals: document.getElementById('f-intervals').value,
    riffNotes: document.getElementById('f-riff-notes').value,
    mood,
    emoji: document.getElementById('f-emoji').value,
    notes: document.getElementById('f-notes').value,
  };

  sessions.unshift(session);
  localStorage.setItem('practice_sessions', JSON.stringify(sessions));
  resetForm();
  updateStreak();
  showToast('Session saved ✓');
}

function resetForm(){
  document.getElementById('f-date').value = todayStr();
  ['f-duration','f-bpm-start','f-bpm-end','f-preset','f-intervals','f-riff-notes','f-notes']
    .forEach(id=>{ const el=document.getElementById(id); if(el) el.value=''; });
  ['f-break','f-key','f-mode','f-scales','f-metro','f-riff']
    .forEach(id=>{ const el=document.getElementById(id); if(el) el.value=''; });
  document.querySelectorAll('.check-item').forEach(el=>{
    el.classList.remove('checked');
    el.dataset.checked='0';
  });
  mood = 0; updateStars();
}

// ── STREAK ────────────────────────────────────────────────────────────────
function updateStreak(){
  if(!sessions.length){ document.getElementById('streakNum').textContent='0'; return; }
  const dates = [...new Set(sessions.map(s=>s.date))].sort().reverse();
  let streak = 0;
  let check = new Date(todayStr());
  for(const d of dates){
    const dd = new Date(d);
    const diff = Math.round((check-dd)/(1000*60*60*24));
    if(diff===0||diff===1){ streak++; check=dd; }
    else break;
  }
  document.getElementById('streakNum').textContent = streak;
}

// ── ANALYTICS ─────────────────────────────────────────────────────────────
function renderAnalytics(){
  const el = document.getElementById('analytics-content');
  if(!sessions.length){
    el.innerHTML=`<div class="empty-state"><p><strong>No sessions logged yet.</strong><br>Log your first session to see analytics.</p></div>`;
    return;
  }

  const totalSessions = sessions.length;
  const totalMin = sessions.reduce((a,s)=>a+(s.duration||0),0);
  const avgMin = Math.round(totalMin/totalSessions);
  const riffSessions = sessions.filter(s=>s.riff&&s.riff.includes('yes')).length;
  const breakPct = Math.round(sessions.filter(s=>s.break==='yes').length/totalSessions*100);

  // Technique counts
  const techCounts = {};
  TECHNIQUES.forEach(t=>techCounts[t]=0);
  sessions.forEach(s=>(s.techniques||[]).forEach(t=>{ if(techCounts[t]!==undefined) techCounts[t]++; }));
  const sorted = Object.entries(techCounts).sort((a,b)=>b[1]-a[1]);
  const maxCount = sorted[0]?.[1]||1;
  const fav = sorted.filter(([,v])=>v>0)[0];
  const least = sorted.filter(([,v])=>v>0).slice(-1)[0];
  const never = sorted.filter(([,v])=>v===0).map(([k])=>k);

  // BPM progression
  const bpmData = sessions.filter(s=>s.bpmEnd).map(s=>({date:s.date,bpm:s.bpmEnd})).reverse().slice(-20);

  // CAGED counts
  const cagedCounts = {};
  CAGED_POS.forEach(p=>cagedCounts[p]=0);
  sessions.forEach(s=>(s.cagedPos||[]).forEach(p=>{ if(cagedCounts[p]!==undefined) cagedCounts[p]++; }));

  // Heatmap — last 84 days
  const heatDates = {};
  sessions.forEach(s=>{ if(s.date) heatDates[s.date]=(heatDates[s.date]||0)+(s.duration||30); });
  const today = new Date(todayStr());
  let heatHtml = '';
  for(let i=83;i>=0;i--){
    const d=new Date(today); d.setDate(d.getDate()-i);
    const ds=d.toISOString().split('T')[0];
    const mins=heatDates[ds]||0;
    const cls=mins===0?'':mins<30?'practiced-low':mins<60?'practiced-mid':'practiced-high';
    const isToday=ds===todayStr()?'today':'';
    heatHtml+=`<div class="hm-day ${cls} ${isToday}" title="${ds}${mins?' · '+mins+'min':''}"></div>`;
  }

  // Key distribution
  const keyCounts = {};
  sessions.forEach(s=>{ if(s.key){ keyCounts[s.key]=(keyCounts[s.key]||0)+1; } });
  const keyTop = Object.entries(keyCounts).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const keyMax = keyTop[0]?.[1]||1;

  // Mood avg
  const moodSessions = sessions.filter(s=>s.mood>0);
  const avgMood = moodSessions.length ? (moodSessions.reduce((a,s)=>a+s.mood,0)/moodSessions.length).toFixed(1) : '—';

  el.innerHTML = `
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-num red">${totalSessions}</div>
        <div class="stat-label">Sessions</div>
      </div>
      <div class="stat-card">
        <div class="stat-num blue">${avgMin}<span style="font-size:12px">m</span></div>
        <div class="stat-label">Avg length</div>
      </div>
      <div class="stat-card">
        <div class="stat-num green">${riffSessions}</div>
        <div class="stat-label">Riffs made</div>
      </div>
    </div>

    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-num">${Math.round(totalMin/60)}<span style="font-size:12px">h</span></div>
        <div class="stat-label">Total time</div>
      </div>
      <div class="stat-card">
        <div class="stat-num">${breakPct}<span style="font-size:12px">%</span></div>
        <div class="stat-label">Break taken</div>
      </div>
      <div class="stat-card">
        <div class="stat-num">${avgMood}</div>
        <div class="stat-label">Avg mood</div>
      </div>
    </div>

    <div class="heatmap-wrap">
      <div class="heatmap-title">Practice streak — last 84 days <span style="font-size:8px;color:var(--muted2);margin-left:8px">■ light ■ mid ■ heavy</span></div>
      <div class="heatmap">${heatHtml}</div>
    </div>

    <div class="insights">
      ${fav?`<div class="insight-card highlight">
        <div class="insight-label">Most practiced</div>
        <div class="insight-val">${fav[0]}</div>
        <div class="insight-sub">${fav[1]} session${fav[1]!==1?'s':''}</div>
      </div>`:''}
      ${least?`<div class="insight-card low">
        <div class="insight-label">Least practiced</div>
        <div class="insight-val">${least[0]}</div>
        <div class="insight-sub">${least[1]} session${least[1]!==1?'s':''} — needs work</div>
      </div>`:''}
      ${never.length?`<div class="insight-card" style="grid-column:1/-1">
        <div class="insight-label">Never practiced (${never.length} techniques)</div>
        <div class="insight-val" style="font-size:11px;color:var(--muted2)">${never.slice(0,8).join(' · ')}</div>
      </div>`:''}
    </div>

    <div class="chart-wrap">
      <div class="chart-title">Technique frequency <span>all sessions</span></div>
      <div class="bar-list">
        ${sorted.filter(([,v])=>v>0).map(([name,count],i)=>`
          <div class="bar-row">
            <div class="bar-label">${name.split(' ')[0].substring(0,10)}</div>
            <div class="bar-track">
              <div class="bar-fill ${i===0?'fav':count===sorted.filter(([,v])=>v>0).slice(-1)[0][1]?'low':''}"
                   style="width:${Math.round(count/maxCount*100)}%"></div>
            </div>
            <div class="bar-count">${count}</div>
          </div>`).join('')}
      </div>
    </div>

    ${keyTop.length?`<div class="chart-wrap">
      <div class="chart-title">Keys practiced</div>
      <div class="bar-list">
        ${keyTop.map(([k,c])=>`
          <div class="bar-row">
            <div class="bar-label">${k.split(' ')[0]}</div>
            <div class="bar-track"><div class="bar-fill" style="width:${Math.round(c/keyMax*100)}%;background:var(--blue)"></div></div>
            <div class="bar-count">${c}</div>
          </div>`).join('')}
      </div>
    </div>`:''}

    ${bpmData.length>1?`<div class="bpm-timeline">
      <div class="heatmap-title">BPM progression — last ${bpmData.length} metronome sessions</div>
      <div class="bpm-dots">
        ${bpmData.map(d=>{
          const maxBpm=Math.max(...bpmData.map(x=>x.bpm));
          const minBpm=Math.min(...bpmData.map(x=>x.bpm));
          const range=maxBpm-minBpm||1;
          const h=Math.round(((d.bpm-minBpm)/range)*40)+8;
          return `<div class="bpm-dot-wrap">
            <div class="bpm-dot" style="height:${h}px" title="${d.bpm}bpm · ${d.date}"></div>
            <div class="bpm-tick">${d.bpm}</div>
          </div>`;
        }).join('')}
      </div>
    </div>`:''}

    <div class="chart-wrap">
      <div class="chart-title">CAGED positions</div>
      <div class="bar-list">
        ${CAGED_POS.map(p=>{
          const c=cagedCounts[p]||0;
          const maxC=Math.max(...Object.values(cagedCounts))||1;
          return `<div class="bar-row">
            <div class="bar-label">${p.split(' ')[1]||p}</div>
            <div class="bar-track"><div class="bar-fill" style="width:${Math.round(c/maxC*100)}%;background:var(--purple)"></div></div>
            <div class="bar-count">${c}</div>
          </div>`;
        }).join('')}
      </div>
    </div>
  `;
}

// ── HISTORY ───────────────────────────────────────────────────────────────
function renderHistory(){
  const el = document.getElementById('history-list');
  let filtered = sessions;
  if(historyFilter==='riff') filtered=sessions.filter(s=>s.riff?.includes('yes'));
  if(historyFilter==='sweep') filtered=sessions.filter(s=>s.techniques?.includes('Sweeping'));
  if(historyFilter==='caged') filtered=sessions.filter(s=>s.cagedPos?.length>0);
  if(historyFilter==='metro') filtered=sessions.filter(s=>s.metronome==='yes');

  if(!filtered.length){
    el.innerHTML=`<div class="empty-state"><p>${sessions.length===0?'<strong>No sessions yet.</strong><br>Log your first session above.':'<strong>No sessions match this filter.</strong>'}</p></div>`;
    return;
  }

  el.innerHTML = filtered.map(s=>{
    const techs = (s.techniques||[]).slice(0,4).map(t=>`<span class="etag">${t}</span>`).join('');
    const riffTag = s.riff?.includes('yes')?'<span class="etag red">Riff ✓</span>':'';
    const bpmStr = s.bpmStart&&s.bpmEnd?`${s.bpmStart}→${s.bpmEnd}bpm`:s.bpmEnd?`${s.bpmEnd}bpm`:'';
    const summary = [s.key,s.techniques?.length?s.techniques.length+' techniques':'',bpmStr].filter(Boolean).join(' · ');
    return `<div class="entry-card">
      <div class="entry-header" onclick="toggleEntry(this)">
        <div class="entry-date">${formatDate(s.date)}</div>
        <div class="entry-summary">${summary||'Session'}</div>
        <div class="entry-dur">${s.duration?s.duration+'m':''}</div>
        <div class="entry-mood">${s.emoji||''}</div>
      </div>
      <div class="entry-body">
        ${s.key?`<strong>Key</strong> ${s.key}${s.mode?' · '+s.mode:''}<br>`:''}
        ${s.techniques?.length?`<strong>Techniques</strong> ${s.techniques.join(', ')}<br>`:''}
        ${s.cagedPos?.length?`<strong>CAGED</strong> ${s.cagedPos.join(', ')}<br>`:''}
        ${s.rhythms?.length?`<strong>Rhythms</strong> ${s.rhythms.join(', ')}<br>`:''}
        ${s.metronome==='yes'&&bpmStr?`<strong>Metronome</strong> ${bpmStr}<br>`:''}
        ${s.preset?`<strong>Preset</strong> ${s.preset}<br>`:''}
        ${s.intervals?`<strong>Intervals</strong> ${s.intervals}<br>`:''}
        ${s.riffNotes?`<strong>Riff notes</strong> ${s.riffNotes}<br>`:''}
        ${s.notes?`<strong>Notes</strong> ${s.notes}<br>`:''}
        ${s.break?`<strong>Break taken</strong> ${s.break}<br>`:''}
        ${s.mood?`<strong>Mood</strong> ${'★'.repeat(s.mood)}${'☆'.repeat(5-s.mood)}<br>`:''}
        <div class="entry-tags">${riffTag}${techs}</div>
        <button class="delete-btn" onclick="deleteSession(${s.id})">Delete</button>
      </div>
    </div>`;
  }).join('');
}

function toggleEntry(header){
  header.nextElementSibling.classList.toggle('open');
}

function filterHistory(filter, btn){
  historyFilter = filter;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderHistory();
}

function deleteSession(id){
  if(!confirm('Delete this session?')) return;
  sessions = sessions.filter(s=>s.id!==id);
  localStorage.setItem('practice_sessions', JSON.stringify(sessions));
  renderHistory();
  updateStreak();
  showToast('Session deleted');
}

function formatDate(ds){
  if(!ds) return '';
  const d = new Date(ds+'T12:00:00');
  return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'2-digit'});
}

// ── NAV ───────────────────────────────────────────────────────────────────
function setPage(p){
  document.querySelectorAll('.nav-btn').forEach((b,i)=>{
    b.classList.toggle('active',['log','analytics','history'][i]===p);
  });
  document.querySelectorAll('.page').forEach(el=>el.classList.remove('active'));
  document.getElementById('page-'+p).classList.add('active');
  if(p==='analytics') renderAnalytics();
  if(p==='history') renderHistory();
}

// ── TOAST ─────────────────────────────────────────────────────────────────
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2200);
}

// ── GO ────────────────────────────────────────────────────────────────────
init();
</script>
</body>
</html>
